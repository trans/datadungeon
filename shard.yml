name: data_dungeon
version: 0.15.7

authors:
  - Thomas Sawyer <transfire@gmail.com>

# DataDungeon's JSON API on its own, next to a database (src/dd_serve.cr)
targets:
  dd-serve:
    main: src/dd_serve.cr

dependencies:
  sqlite3:
    github: crystal-lang/crystal-sqlite3

development_dependencies:
  # For SemanticIndex (data_dungeon/semantic) and dd-serve's search; needs libmagic.
  memo:
    github: openbohemians/memo
    version: ~> 0.13.1
  # For MatchIndex (data_dungeon/matches): USearch, with its C library.
  usearch:
    github: trans/usearch.cr
    version: ~> 0.1
  # For S3Storage; until taylorfinnell/awscr-s3#168 (S3::Exception#status) is released.
  awscr-s3:
    github: trans/awscr-s3
    branch: exception-status

crystal: '>= 1.19.1'

license: MIT
