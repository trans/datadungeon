# Body measurement definitions — single source of truth.
#
# Pipeline:
#   1. Race + gender defines valid ranges and defaults
#   2. Player picks measurements in inches
#   3. Measurements rounded to bucket steps for cache keys
#   4. One LLM call: all measurements + race/gender/skin/hair/etc
#      → canonical appearance description (stored on character)
#   5. All portrait prompts use that stored description
#
# Raw inches stored on character record for UI.
# Bucket-rounded values used for cache key only.

# ── Global measurement definitions ──
# Units, step sizes, and cache bucket granularity.

measurements:
  height:
    label: Height
    unit: inches
    display: feet-inches
    step: 1
    bucket_step: 3          # cache rounds to nearest 3"

  shoulders:
    label: Shoulders
    unit: inches
    step: 0.5
    bucket_step: 2

  chest:
    label: Chest
    unit: inches
    step: 1
    bucket_step: 2

  waist:
    label: Waist
    unit: inches
    step: 1
    bucket_step: 3

  hips:
    label: Hips
    unit: inches
    step: 1
    bucket_step: 3

  neck:
    label: Neck
    unit: inches
    step: 0.5
    bucket_step: 1

  arm_length:
    label: Arm Length
    unit: inches
    step: 0.5
    bucket_step: 3

  leg_inseam:
    label: Leg Inseam
    unit: inches
    step: 0.5
    bucket_step: 3

# ── PHY condition tiers (d20) ──
# Groups of 4: 1-4, 5-8, 9-12, 13-16, 17-20.
# Modifies how the body looks, not its shape.

phy_tiers:
  0: feeble
  1: soft
  2: average
  3: fit
  4: mighty

